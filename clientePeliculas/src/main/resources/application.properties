server.port=9000
spring.application.name=cliente-peliculas

# URL base del microservicio de películas y actores.
# En el trabajo final pasará a ser la del Gateway (http://localhost:8090/...).
peliculas.api.url=http://localhost:8001

# Sesión solo por cookie: evita que aparezca ;jsessionid=... en la URL tras una redirección.
server.servlet.session.tracking-modes=cookie

# Subida de portadas
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
