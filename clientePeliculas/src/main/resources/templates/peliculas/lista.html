<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: cabecera('Películas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="mb-0">Películas</h1>
        <a class="btn btn-primary" th:href="@{/peliculas/nueva}">Nueva película</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <!-- Búsqueda combinable: los campos vacíos no filtran. -->
    <form class="row g-2 align-items-end mb-4" th:action="@{/peliculas}" method="get" role="search">
        <div class="col-sm-4">
            <label for="titulo" class="form-label">Título</label>
            <input type="search" class="form-control" id="titulo" name="titulo" th:value="${titulo}">
        </div>
        <div class="col-sm-3">
            <label for="genero" class="form-label">Género</label>
            <input type="search" class="form-control" id="genero" name="genero" th:value="${genero}">
        </div>
        <div class="col-sm-3">
            <label for="actor" class="form-label">Actor</label>
            <input type="search" class="form-control" id="actor" name="actor" th:value="${actor}">
        </div>
        <div class="col-sm-2 d-flex gap-2">
            <button type="submit" class="btn btn-secondary">Buscar</button>
            <a class="btn btn-outline-secondary" th:href="@{/peliculas}">Limpiar</a>
        </div>
    </form>

    <p th:if="${#lists.isEmpty(peliculas)}" class="text-muted">No hay películas que coincidan con la búsqueda.</p>

    <div th:unless="${#lists.isEmpty(peliculas)}" class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th scope="col">Título</th>
                <th scope="col">Año</th>
                <th scope="col">Género</th>
                <th scope="col">Dirección</th>
                <th scope="col">Reparto</th>
                <th scope="col"><span class="visually-hidden">Acciones</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${peliculas}">
                <td><a th:href="@{/peliculas/{id}(id=${p.idPelicula})}" th:text="${p.titulo}"></a></td>
                <td th:text="${p.anio}"></td>
                <td th:text="${p.genero}"></td>
                <td th:text="${p.director}"></td>
                <td th:text="${#strings.listJoin(p.actores.![nombre], ', ')}"></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/peliculas/{id}/editar(id=${p.idPelicula})}">Editar</a>
                    <form class="d-inline" method="post"
                          th:action="@{/peliculas/{id}/eliminar(id=${p.idPelicula})}"
                          th:attr="onsubmit=|return confirm('¿Eliminar «${p.titulo}»?')|">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
